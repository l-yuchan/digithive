name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an already published tag instead of building (rollback or pinning). Empty builds the current head."
        required: false
        default: ""

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/digithive-harness
  DEPLOY_DIR: /home/leefam/digithive-harness/deploy
  PUBLIC_URL: https://digithive.chanoil.com
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: build and push image
    # workflow_run fires for failed ci runs too; a red build must never deploy.
    # A pinned tag needs no build, so publish is skipped for it.
    if: |
      inputs.image_tag == '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/harness
          push: true
          build-args: |
            GIT_COMMIT=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: deploy on mini
    needs: publish
    if: |
      always() && !cancelled() && (needs.publish.result == 'success' || inputs.image_tag != '')
    runs-on: [self-hosted, mini]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: log in to GHCR for this job only
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: sync compose definition
        run: install -D -m 644 apps/harness/deploy/compose.yml "$DEPLOY_DIR/compose.yml"

      - name: remember the running image
        id: previous
        run: |
          set -euo pipefail
          file="$DEPLOY_DIR/.harness_image"
          current="$(cat "$file" 2>/dev/null || docker inspect --format '{{.Config.Image}}' deploy-harness-1 2>/dev/null || true)"
          printf 'image=%s\n' "$current" >> "$GITHUB_OUTPUT"
          echo "previous: ${current:-<none>}"

      - name: pull and restart
        env:
          HARNESS_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose pull harness harness-worker
          docker compose up -d --no-build
          printf '%s\n' "$HARNESS_IMAGE" > .harness_image
          docker compose ps

      - name: health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS -m 5 "$PUBLIC_URL/api/session" > /dev/null; then
              echo "public surface answered on attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          echo "::error::public surface did not answer after restart"
          docker compose -f "$DEPLOY_DIR/compose.yml" logs --tail 60 harness || true
          exit 1

      - name: roll back to the previous image
        if: failure()
        env:
          PREVIOUS: ${{ steps.previous.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "no previous image recorded; leaving the new one in place"
            exit 0
          fi
          cd "$DEPLOY_DIR"
          export HARNESS_IMAGE="$PREVIOUS"
          docker compose pull harness harness-worker || true
          docker compose up -d --no-build
          printf '%s\n' "$PREVIOUS" > .harness_image
          echo "rolled back to $PREVIOUS"
