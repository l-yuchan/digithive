services:
  digithive:
    build: .
    environment:
      DIGITHIVE_HOST: 0.0.0.0
      DIGITHIVE_PORT: 3000
      DIGITHIVE_DB: /data/digithive.sqlite
      DIGITHIVE_BACKUP_DIR: /backups
      DIGITHIVE_PUBLIC_HOST: ${DIGITHIVE_DOMAIN:-digithive.chanoil.com}
      DIGITHIVE_PASSPHRASE: ${DIGITHIVE_PASSPHRASE:?set DIGITHIVE_PASSPHRASE in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - digithive-data:/data
      - digithive-backups:/backups
    restart: unless-stopped

volumes:
  digithive-data:
  digithive-backups:
